name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bunx tsgo --noEmit || true
      - name: Unit & property tests
        run: bunx vitest run --reporter=verbose
      - name: Build
        run: bun run build

  a11y:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - name: Start preview
        run: bun run build && bun run preview &
      - name: Wait for server
        run: npx wait-on http://localhost:4173 -t 60000
      - name: Axe accessibility scan
        run: npx @axe-core/cli http://localhost:4173 --exit || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: "0"
