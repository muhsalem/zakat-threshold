name: CI

on:
  push:
    branches: [main]
  pull_request:

# ألغِ التشغيلات السابقة على نفس الفرع لتقليل الازدحام
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check · Lint · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # فحص أنواع صارم — أي خطأ TS يوقف CI
      - name: Type-check (strict)
        run: bunx tsgo --noEmit

      # ESLint — الأخطاء تفشل CI؛ التحذيرات مسموحة (لا تعطيل للأخطاء)
      - name: Lint
        run: bunx eslint .

      # اختبارات الوحدات والخصائص — بدون تجاوز
      - name: Unit & property tests
        run: bunx vitest run --reporter=verbose

      # بناء الإنتاج — تأكيد عدم كسر البناء
      - name: Production build
        run: bun run build

      # حفظ مخرجات البناء لاستخدامها في مهمة a11y بدون إعادة البناء
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
            .output
          if-no-files-found: ignore
          retention-days: 1

  a11y:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist

      # تشغيل preview في الخلفية مع سجل مستقل — أي فشل في الإقلاع يظهر بوضوح
      - name: Start preview server
        run: |
          nohup bun run preview > preview.log 2>&1 &
          echo $! > preview.pid

      - name: Wait for preview
        run: npx --yes wait-on http://localhost:4173 -t 60000

      # فحص axe — --exit يعيد كود خروج ≠ 0 عند أي انتهاك، فيفشل CI
      - name: Axe accessibility scan
        run: npx --yes @axe-core/cli http://localhost:4173 --exit

      - name: Preview server logs (on failure)
        if: failure()
        run: cat preview.log || true

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then kill "$(cat preview.pid)" || true; fi

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      # Trivy — أي ثغرة HIGH/CRITICAL تفشل CI (سابقاً كان exit-code=0 يبتلع الأخطاء)
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
