name: CI

on:
  push:
    branches: [main]
  pull_request:

# ألغِ التشغيلات السابقة على نفس الفرع لتقليل الازدحام
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check · Lint · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # فحص أنواع صارم — أي خطأ TS يوقف CI
      - name: Type-check (strict)
        run: bunx tsgo --noEmit

      # ESLint — الأخطاء تفشل CI؛ التحذيرات مسموحة (لا تعطيل للأخطاء)
      - name: Lint
        run: bunx eslint .

      # اختبارات الوحدات والخصائص — بدون تجاوز
      - name: Unit & property tests
        run: bunx vitest run --reporter=verbose

      # بناء الإنتاج — تأكيد عدم كسر البناء
      - name: Production build
        run: bun run build

      # حفظ مخرجات البناء لاستخدامها في مهمة a11y بدون إعادة البناء
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
            .output
          if-no-files-found: ignore
          retention-days: 1

  a11y:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist

      # تشغيل preview في الخلفية مع سجل مستقل — أي فشل في الإقلاع يظهر بوضوح
      - name: Start preview server
        run: |
          nohup bun run preview > preview.log 2>&1 &
          echo $! > preview.pid

      - name: Wait for preview
        run: npx --yes wait-on http://localhost:4173 -t 60000

      # فحص axe — --exit يعيد كود خروج ≠ 0 عند أي انتهاك، فيفشل CI
      - name: Axe accessibility scan
        run: npx --yes @axe-core/cli http://localhost:4173 --exit

      - name: Preview server logs (on failure)
        if: failure()
        run: cat preview.log || true

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then kill "$(cat preview.pid)" || true; fi

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      # Trivy — أي ثغرة HIGH/CRITICAL تفشل CI (سابقاً كان exit-code=0 يبتلع الأخطاء)
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  rtl-pagination:
    name: RTL pagination · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright (Python)
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps ${{ matrix.browser }}

      # نفس matrix للأحجام (mobile/tablet/desktop) داخل السكربت — نغيّر المتصفح فقط
      - name: Run RTL pagination behavioral tests
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: python tests/visual-rtl/run-data.py

      # تنقّل الكيبورد (Arrow/Home/End + Tab/Shift+Tab) وحلقة التركيز في RTL وLTR
      - name: Run keyboard-nav & focus-ring tests
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: python tests/visual-rtl/run-keyboard.py

      # ARIA / semantics: role, aria-label, aria-live, aria-current, aria-disabled
      - name: Run ARIA / semantics tests
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: python tests/visual-rtl/run-aria.py





      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-pagination-failures-${{ matrix.browser }}
          path: tests/visual-rtl/_capture/fail_*.png
          if-no-files-found: ignore
          retention-days: 7

