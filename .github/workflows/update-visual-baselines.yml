name: Update visual baselines

# تجديد البيسلاينز البصرية من بيئة CI نفسها (ubuntu + chromium المثبت) —
# يُشغَّل يدوياً بعد أي ترقية مقصودة لإصدار Playwright أو تغيير في تصميم الـpager.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright (pinned) + Pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.61.0 pillow
          python -m playwright install --with-deps chromium

      - name: Regenerate baselines
        run: python tests/visual-rtl/run.py --update

      - name: Commit refreshed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual-rtl/baselines
          if git diff --cached --quiet; then
            echo "Baselines unchanged — nothing to commit."
          else
            git commit -m "chore: refresh visual baselines from CI environment"
            git push
          fi
